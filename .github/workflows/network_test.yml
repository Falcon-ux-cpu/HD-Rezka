name: HDRezka Tracker Workflow

on:
  workflow_dispatch: # Триггер для cron-job.org / ручного запуска
#  schedule:
#    - cron: '0 */6 * * *' # Автоматический запуск каждые 6 часов (резервный)

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: Запуск парсера
        env:
          GHOST_GIST_TOKEN: ${{ secrets.GHOST_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python parser.py
